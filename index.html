<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oracle Mini Moi, ta prédiction du jour</title>
  <meta name="description" content="Mini Moi, l'assistante personnelle de Makboulath, lit les signes et te glisse une prédiction fun." />
  <meta name="theme-color" content="#F6F3EE" />
  <link rel="icon" href="assets/mini-moi.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="net" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <img class="brand-face" src="assets/mini-moi.jpg" alt="Mini Moi" />
      <div>
        <p class="eyebrow">Makboulath · Mini Moi</p>
        <strong>Oracle Mini Moi</strong>
      </div>
    </div>
  </header>
  <main id="app">
    <section class="screen active" data-screen="landing">
      <div class="hero">
        <span class="pill">pas un vrai horoscope · encore mieux</span>
        <h1>Ton avenir<br />tient dans<br /><em>une carte.</em></h1>
        <p class="lede">Mini Moi lit tes vibes, tes dates et tes envies. Elle te sort une prédiction simple. Jamais trop sérieuse. Souvent un peu trop juste. Souffle un peu.</p>
        <button class="btn btn-dark" data-go="form">Découvrir mon avenir</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
